<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="display:flex;align-items:center;gap:4px;height:68px;padding:0 12px 8px;background:#0B0C0E;border-top:1px solid rgba(255,255,255,.06);box-sizing:border-box">
  <button onClick="{{ toScan }}" style="width:48px;height:48px;flex:none;display:flex;align-items:center;justify-content:center;background:transparent;border:0;cursor:pointer" style-hover="opacity:.7">
    <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="rgba(244,241,234,.55)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8V6a2 2 0 0 1 2-2h2M16 4h2a2 2 0 0 1 2 2v2M20 16v2a2 2 0 0 1-2 2h-2M8 20H6a2 2 0 0 1-2-2v-2"></path><path d="M4 12h16"></path></svg>
  </button>
  <button onClick="{{ toHome }}" style="flex:1;height:44px;border-radius:9999px;border:0;background:{{ homeBg }};color:{{ homeColor }};font:600 13px/1 Manrope,system-ui;letter-spacing:.1em;cursor:pointer">WALLET</button>
  <button onClick="{{ toActivity }}" style="flex:1;height:44px;border-radius:9999px;border:0;background:{{ actBg }};color:{{ actColor }};font:600 13px/1 Manrope,system-ui;letter-spacing:.1em;cursor:pointer">ACTIVITY</button>
  <button onClick="{{ toSettings }}" style="width:48px;height:48px;flex:none;display:flex;align-items:center;justify-content:center;background:transparent;border:0;cursor:pointer" style-hover="opacity:.7">
    <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="rgba(244,241,234,.55)" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"></path></svg>
  </button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;current&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;home&quot;,&quot;activity&quot;],&quot;default&quot;:&quot;home&quot;,&quot;tsType&quot;:&quot;'home'|'activity'&quot;},&quot;onNav&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(route: string) =&gt; void&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const cur = this.props.current || 'home';
    const nav = this.props.onNav || (() => {});
    return {
      homeBg: cur === 'home' ? '#F4F1EA' : 'transparent',
      homeColor: cur === 'home' ? '#0B0C0E' : 'rgba(244,241,234,.45)',
      actBg: cur === 'activity' ? '#F4F1EA' : 'transparent',
      actColor: cur === 'activity' ? '#0B0C0E' : 'rgba(244,241,234,.45)',
      toHome: () => nav('home'), toActivity: () => nav('activity'),
      toScan: () => nav('scan'), toSettings: () => nav('settings'),
    };
  }
}
</script>
</body>
</html>
