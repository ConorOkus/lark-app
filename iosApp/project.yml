name: iosApp
options:
  minimumXcodeGenVersion: "2.38.0"
  deploymentTarget:
    iOS: "16.0"
targets:
  iosApp:
    type: application
    platform: iOS
    sources:
      - iosApp
    # Compose Multiplatform's PlistSanityCheck aborts at runtime unless this key
    # is a literal Info.plist entry (no INFOPLIST_KEY_* build setting exists for it).
    info:
      path: iosApp/Info.plist
      properties:
        CADisableMinimumFrameDurationOnPhone: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: xyz.lark.app
        PRODUCT_NAME: lark
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: lark
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        OTHER_LDFLAGS: "$(inherited) -framework ComposeApp"
        FRAMEWORK_SEARCH_PATHS: "$(inherited) $(SRCROOT)/../composeApp/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
        # The Kotlin framework only builds iosArm64 + iosSimulatorArm64; add an
        # iosX64() target in composeApp before removing this exclusion.
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
    preBuildScripts:
      - name: Compile Kotlin Framework
        basedOnDependencyAnalysis: false
        script: |
          # Xcode build phases run in a minimal shell: JAVA_HOME is unset unless
          # inherited from the caller (as in scripts/ci.sh).
          if [ "${JAVA_HOME:-}" = "" ]; then
            JAVA_HOME=$(/usr/libexec/java_home -v 21+ 2>/dev/null || echo /opt/homebrew/opt/openjdk@21)
            export JAVA_HOME
          fi
          if [ ! -x "${JAVA_HOME}/bin/java" ]; then
            echo "error: no JDK found. Set JAVA_HOME or install one, e.g. 'brew install openjdk@21'." >&2
            exit 1
          fi
          cd "$SRCROOT/.."
          ./gradlew :composeApp:embedAndSignAppleFrameworkForXcode

  # The iOS half of the FFI threading experiment (see the test's own docs and
  # docs/ffi/kotlin-bindings-status.md). Deliberately independent of the iosApp target: it links
  # only the Rust static library and the generated Swift glue, so nothing about the Compose
  # framework or the Kotlin build can influence the result.
  #
  # Simulator-only by construction — LIBRARY_SEARCH_PATHS names the ios-sim target dir. Rebuild
  # that library with:
  #   cd rust/lark-ffi && cargo build --target aarch64-apple-ios-sim
  # and regenerate the glue with uniffi-bindgen --language swift (see scripts/build-xcframework.sh).
  FfiThreadingTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: FfiThreadingTests/FfiAsyncThreadingTests.swift
      - path: FfiThreadingTests/Generated/lark_ffi.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: xyz.lark.app.ffithreadingtests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_INCLUDE_PATHS: "$(inherited) $(SRCROOT)/FfiThreadingTests/Generated/include"
        LIBRARY_SEARCH_PATHS: "$(inherited) $(SRCROOT)/../rust/lark-ffi/target/aarch64-apple-ios-sim/debug"
        OTHER_LDFLAGS: "$(inherited) -llark_ffi"
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64

schemes:
  FfiThreadingTests:
    build:
      targets:
        FfiThreadingTests: [test]
    test:
      targets:
        - FfiThreadingTests
