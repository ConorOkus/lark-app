name: iosApp
options:
  minimumXcodeGenVersion: "2.38.0"
  deploymentTarget:
    iOS: "16.0"
targets:
  iosApp:
    type: application
    platform: iOS
    sources:
      - iosApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: xyz.lark.app
        PRODUCT_NAME: lark
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: lark
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        OTHER_LDFLAGS: "$(inherited) -framework ComposeApp"
        FRAMEWORK_SEARCH_PATHS: "$(inherited) $(SRCROOT)/../composeApp/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
        # The Kotlin framework only builds iosArm64 + iosSimulatorArm64; add an
        # iosX64() target in composeApp before removing this exclusion.
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
    preBuildScripts:
      - name: Compile Kotlin Framework
        basedOnDependencyAnalysis: false
        script: |
          # Xcode build phases run in a minimal shell: JAVA_HOME is unset unless
          # inherited from the caller (as in scripts/ci.sh).
          if [ "${JAVA_HOME:-}" = "" ]; then
            JAVA_HOME=$(/usr/libexec/java_home -v 21+ 2>/dev/null || echo /opt/homebrew/opt/openjdk@21)
            export JAVA_HOME
          fi
          if [ ! -x "${JAVA_HOME}/bin/java" ]; then
            echo "error: no JDK found. Set JAVA_HOME or install one, e.g. 'brew install openjdk@21'." >&2
            exit 1
          fi
          cd "$SRCROOT/.."
          ./gradlew :composeApp:embedAndSignAppleFrameworkForXcode
